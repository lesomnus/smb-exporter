name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # Resolves the module graph and writes go.sum if it is not committed yet.
      - run: go mod tidy
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
